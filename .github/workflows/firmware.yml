name: firmware

# For now, this workflow is used for checks, not for releases.
# So all release stuff is commented out.

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'
  pull_request: {}
  release:
    types: [published]

permissions:
  contents: write

jobs:
  keira:
    runs-on: ubuntu-latest
    # Must match KEIRA_IDF_VERSION in boards/lilka_v2/board.cmake
    container: espressif/idf:v4.4.7
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true

      - uses: actions/cache@v4
        with:
          path: .ccache
          key: ccache-${{ hashFiles('.gitmodules', 'boards/**') }}-${{ github.sha }}
          restore-keys: ccache-${{ hashFiles('.gitmodules', 'boards/**') }}-

      - name: Extract version and generate Keira header
        id: version
        env:
          RELEASE_PRERELEASE: ${{ github.event.release.prerelease }}
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            TAG="${GITHUB_REF#refs/tags/}"
            VERSION="${TAG#v}"
            PRERELEASE="false"
            IFS='.' read -r MAJOR MINOR PATCH <<< "$VERSION"

            # Use prerelease info from event payload if available
            if [[ "${GITHUB_EVENT_NAME}" == "release" && "${RELEASE_PRERELEASE}" == "true" ]]; then
              VERSION_TYPE="KEIRA_VERSION_TYPE_PRE_RELEASE"
              PRERELEASE="true"
            else
              VERSION_TYPE="KEIRA_VERSION_TYPE_RELEASE"
            fi
          else
            TAG=""
            MAJOR=0
            MINOR=0
            PATCH=0
            VERSION="0.0.0"
            PRERELEASE="false"
            VERSION_TYPE="KEIRA_VERSION_TYPE_DEV"
          fi

          cat > src/keira/keira_version_auto_gen.h <<EOF
          #pragma once
          #ifndef KEIRA_VERSION_AUTO_GEN_H
          #define KEIRA_VERSION_AUTO_GEN_H

          #define KEIRA_VERSION_MAJOR $MAJOR
          #define KEIRA_VERSION_MINOR $MINOR
          #define KEIRA_VERSION_PATCH $PATCH
          #define KEIRA_VERSION_TYPE $VERSION_TYPE

          #endif // KEIRA_VERSION_AUTO_GEN_H
          EOF

          echo "VERSION_TYPE=$VERSION_TYPE" >> "$GITHUB_OUTPUT"

          echo "Generated version:"
          cat src/keira/keira_version_auto_gen.h

          echo "TAG=$TAG" >> "$GITHUB_OUTPUT"
          echo "VERSION=$VERSION" >> "$GITHUB_OUTPUT"
          echo "VERSION_TYPE=$VERSION_TYPE" >> "$GITHUB_OUTPUT"
          echo "PRERELEASE=$PRERELEASE" >> "$GITHUB_OUTPUT"

      - name: Build and package firmware
        run: |
          # container: jobs skip the image entrypoint, so set up the IDF environment here
          . "$IDF_PATH/export.sh"
          export CCACHE_DIR="$GITHUB_WORKSPACE/.ccache"

          # build <build dir> <suffix> [compile flags]
          build() {
            idf.py -B "$1" -DKEIRA_BUILD_FLAGS="$3" build
            cp "$1/keira.bin" "out/keira$2.bin"
            cp "$1/partition_table/partition-table.bin" out/partitions.bin
            cp "$1/bootloader/bootloader.bin" out/bootloader.bin
            (cd "$1" && esptool.py --chip esp32s3 merge_bin -o "$GITHUB_WORKSPACE/out/KeiraOS_merged$2.bin" @flash_args)
          }

          mkdir -p out
          if [[ "${{ steps.version.outputs.VERSION_TYPE }}" != "KEIRA_VERSION_TYPE_DEV" ]]; then
            echo "Tag detected - building for all languages"
            for lang in $(cat languages.txt); do
              echo "Building for $lang"
              build "build-$lang" "_$lang" "-D$lang"
            done
          else
            echo "Main branch or PR - building for default language only"
            build build ""
          fi

      # Manifest used by Keira OTA updater, available at:
      # https://github.com/lilka-dev/keira/releases/latest/download/keira_firmware.json
      - name: Generate firmware manifest
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python tools/gen_firmware_json.py \
            --repo "${{ github.repository }}" \
            --tag "${{ steps.version.outputs.TAG }}" \
            --prerelease "${{ steps.version.outputs.PRERELEASE }}" \
            --bin-dir out \
            --history 5 \
            --output out/keira_firmware.json
          cat out/keira_firmware.json

      - name: Upload firmware artifacts
        uses: actions/upload-artifact@v4
        with:
          name: KeiraOS-firmware
          path: |
            out/*.bin
            out/*.json

      - name: Upload KeiraOS bins to Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: |
            out/*.bin
            out/keira_firmware.json

  github-releases-to-discord:
    needs: keira
    runs-on: ubuntu-latest
    if: github.event_name == 'release'
    steps:
      - name: Checkout
        uses: actions/checkout@v3
      - name: Github Releases To Discord
        uses: SethCohen/github-releases-to-discord@v1.20.0
        with:
          webhook_url: ${{ secrets.WEBHOOK_URL }}
          color: "2105893"
          username: "Release Changelog KeiraOS"
          avatar_url: "https://avatars.githubusercontent.com/u/213694258?s=48&v=4"
          footer_title: "Changelog"
          footer_icon_url: "https://avatars.githubusercontent.com/u/213694258?s=48&v=4"
          footer_timestamp: true